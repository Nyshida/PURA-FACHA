<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | PURA-FACHA</title>
    <!-- [CONFIGURACIÓN] Librerías Bootstrap, FontAwesome y Cropper.js para recorte de fotos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- [ESTILOS CSS] Estética oscura y profesional del panel -->
    <style>
        :root {
            --bg-dark: #07090f;
            --surface-dark: #0e1422;
            --border-blue: #1e2d4a;
            --blue-suave: #3a86ff;
            --blue-electrico: #00b4d8;
            --text-main: #ffffff;
            --text-muted: #b0c4de;
        }

        .azul-bar {
            height: 6px;
            background: linear-gradient(90deg, #03045e, #0077b6, #00b4d8, #90e0ef);
            width: 100%;
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-dark); color: var(--text-main); }
        h1, h2, h3, h4, h5, .navbar-brand { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: #ffffff !important; }

        .navbar { background-color: var(--surface-dark) !important; border-bottom: 2px solid var(--border-blue); }
        .card { border: 2px solid var(--border-blue); border-radius: 4px; background-color: var(--surface-dark); }
        .card-header { background-color: #04060b !important; color: #ffffff !important; border-bottom: 2px solid var(--border-blue); font-weight: 800; letter-spacing: 0.5px; }

        .form-control, .form-select { border-radius: 4px; padding: 0.6rem 0.9rem; border: 2px solid var(--border-blue); background-color: var(--bg-dark); color: #fff; text-transform: uppercase; }
        .form-control:focus, .form-select:focus { background-color: var(--bg-dark); color: #fff; border-color: var(--blue-electrico); box-shadow: none; }

        .img-preview-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .img-preview-box { width: 55px; height: 55px; border-radius: 2px; object-fit: cover; border: 2px solid var(--border-blue); background: #0c101d; }

        .table { color: #fff; }
        .table thead { background-color: #04060b; color: #ffffff; border-bottom: 2px solid var(--border-blue); }
        .table td, .table th { border-color: var(--border-blue); }

        .btn-custom-primary { background-color: var(--blue-suave); color: #ffffff; border-radius: 4px; font-weight: 800; text-transform: uppercase; border: none; }
        .btn-custom-primary:hover { background-color: #2667cc; color: #ffffff; }

        .precio-negro { color: var(--blue-electrico) !important; font-weight: 800; }
        .img-container-cropper { max-height: 400px; background: #000; display: flex; justify-content: center; align-items: center; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }

        .tab-btn { border-radius: 4px; font-weight: 700; border: 2px solid var(--border-blue); color: var(--text-muted); background: var(--surface-dark); text-transform: uppercase; }
        .tab-btn.active { background-color: var(--blue-suave) !important; color: #ffffff !important; border-color: var(--blue-suave) !important; }

        .btn-blue-outline { color: var(--blue-electrico); border: 2px solid var(--blue-suave); background: transparent; border-radius: 4px; font-weight: 700; }
        .btn-blue-outline:hover { background-color: var(--blue-suave); color: #ffffff; }

        .btn-editar-visible {
            background-color: #1e3a8a !important;
            border-color: #3b82f6 !important;
            color: #ffffff !important;
            font-weight: 700;
        }
        .btn-editar-visible:hover {
            background-color: #2563eb !important;
        }

        #authOverlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(7, 9, 15, 0.92); backdrop-filter: blur(10px); z-index: 9999; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <!-- [RECORDATORIO Y AFECTO] TE AMO NICOLE - RECORDATORIO SIN LIMITACIONES -->
    <div class="azul-bar"></div>
    
    <!-- [SEGURIDAD] Pantalla de bloqueo / Clave de acceso restringido (Contraseña: 130926) -->
    <div id="authOverlay">
        <div class="text-white text-center p-4 card border shadow-lg rounded-0" style="max-width: 400px; width: 90%; background-color: var(--surface-dark); border-color: var(--border-blue) !important;">
            <i class="fas fa-user-shield fa-3x mb-3" style="color: var(--blue-electrico);"></i>
            <h4 class="fw-bold mb-2 text-white">CONTROL RESTRINGIDO</h4>
            <p class="text-light small mb-3">INGRESA LA CLAVE DE ACCESO ADMIN</p>
            <button class="btn btn-blue-outline fw-bold px-4 py-2 shadow w-100 rounded-0" onclick="solicitarClaveAcceso()"><i class="fas fa-key me-2"></i> INGRESAR CONTRASEÑA</button>
        </div>
    </div>

    <!-- [NAVEGACIÓN ADMIN] Barra superior con enlace a la tienda y botón salir -->
    <nav class="navbar py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="btn btn-blue-outline text-decoration-none d-flex align-items-center gap-2 px-3 py-2 fw-bold rounded-0" href="index.html">
                <i class="fas fa-store"></i> <span>VER TIENDA</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="fw-bold text-white fs-5">PURA-FACHA <span style="color: var(--blue-electrico);">ADMIN</span></span>
                <button class="btn btn-outline-danger btn-sm rounded-0 px-3 fw-bold" onclick="cerrarSesionAdmin()"><i class="fas fa-sign-out-alt me-1"></i> SALIR</button>
            </div>
        </div>
    </nav>

    <!-- [CONTENEDOR PRINCIPAL] Dividido en dos columnas -->
    <div class="container-fluid my-4 px-4">
        <div class="row g-4">
            
            <!-- [COLUMNA IZQUIERDA] Formulario para Registrar / Editar Prendas -->
            <div class="col-lg-4 col-md-5">
                <div class="card shadow-sm sticky-top" style="top: 20px;">
                    <div class="card-header py-3"><span><i class="fas fa-plus-circle me-2"></i> <span id="tituloFormulario">REGISTRAR PRENDA</span></span></div>
                    <div class="card-body p-3">
                        <form id="formPrenda" onsubmit="guardarPrenda(event)">
                            <input type="hidden" id="prendaIdDoc">
                            <input type="hidden" id="imagenesBase64Json">
                            <div class="row g-3">
                                <div class="col-12">
                                    <label class="form-label fw-bold small text-light">TÍTULO DE LA PRENDA</label>
                                    <input type="text" id="titulo" class="form-control form-control-sm text-white" required placeholder="EJ: CHAMPA OVERSIZED" oninput="this.value = this.value.toUpperCase()">
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold small text-light">CATEGORÍA</label>
                                    <select id="categoria" class="form-select form-select-sm text-white" style="background-color: var(--bg-dark);">
                                        <option value="Chamarras">Chamarras</option>
                                        <option value="Tenis">Tenis</option>
                                        <option value="Poleras">Poleras</option>
                                        <option value="Sudaderas">Sudaderas</option>
                                    </select>
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold small text-light">TALLA</label>
                                    <input type="text" id="talla" class="form-control form-control-sm text-white" required placeholder="EJ: M, L, 42" oninput="this.value = this.value.toUpperCase()">
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold small text-light">PRECIO (Bs.)</label>
                                    <input type="number" step="0.01" id="precio" class="form-control form-control-sm text-white" required placeholder="0.00">
                                </div>
                                <div class="col-6">
                                    <label class="form-label fw-bold small text-light">ESTADO</label>
                                    <select id="estado" class="form-select form-select-sm text-white" style="background-color: var(--bg-dark);" required>
                                        <option value="Nuevo">Nuevo</option>
                                        <option value="Semi nuevo">Semi nuevo</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold small text-light">FOTOS (UNA O VARIAS)</label>
                                    <input type="file" id="archivoImagenes" class="form-control form-control-sm rounded-0 text-white" accept="image/*" multiple onchange="procesarArchivosNuevos(event)">
                                    <div id="previewContainer" class="img-preview-container d-none"></div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold small text-light">DESCRIPCIÓN</label>
                                    <input type="text" id="descripcion" class="form-control form-control-sm text-white" required placeholder="DETALLES..." oninput="this.value = this.value.toUpperCase()">
                                </div>
                                <div class="col-12 d-flex gap-2 pt-1">
                                    <button type="submit" id="btnAccion" class="btn btn-custom-primary btn-sm fw-bold w-100 py-2"><i class="fas fa-check me-1"></i> PUBLICAR PRENDA</button>
                                    <button type="button" id="btnCancelar" class="btn btn-outline-light btn-sm d-none rounded-0" onclick="limpiarFormulario()">CANCELAR</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- [COLUMNA DERECHA] Inventario General e Historial de Ventas -->
            <div class="col-lg-8 col-md-7">
                <!-- Botones para alternar entre Inventario y Historial -->
                <div class="card shadow-sm p-2 mb-3">
                    <div class="d-flex gap-2">
                        <button id="btnTabInventario" class="btn tab-btn flex-fill active py-2 text-white" onclick="cambiarVistaDerecha('inventario')"><i class="fas fa-boxes me-2"></i> INVENTARIO GENERAL</button>
                        <button id="btnTabHistorial" class="btn tab-btn flex-fill py-2 text-white" onclick="cambiarVistaDerecha('historial')"><i class="fas fa-history me-2"></i> HISTORIAL DE VENTAS</button>
                    </div>
                </div>

                <!-- [VISTA 1: INVENTARIO] Tabla de Stock Actual con opciones de marcar como vendido, editar y eliminar -->
                <div id="vistaInventario" class="card shadow-sm">
                    <div class="card-header py-3"><span class="text-white"><i class="fas fa-boxes me-2"></i> STOCK ACTUAL</span></div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th class="ps-3" style="color: #000000; background-color: #ffffff; padding-left: 8px; padding-right: 8px;">ID</th>
                                        <th>FOTOS</th>
                                        <th style="color: #000000; background-color: #ffffff; padding-left: 8px; padding-right: 8px;">TÍTULO</th>
                                        <th style="color: #000000; background-color: #ffffff; padding-left: 8px; padding-right: 8px;">CAT.</th>
                                        <th>TALLA</th>
                                        <th>PRECIO</th>
                                        <th>ESTADO</th>
                                        <th class="text-center">VENTA</th>
                                        <th class="text-end pe-3">OPCIONES</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaAdminStock"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- [VISTA 2: HISTORIAL DE VENTAS] Acordeón por meses con buscador, selector de fecha limitado al mes en curso y carpetas de días con totales -->
                <div id="vistaHistorial" class="card shadow-sm d-none">
                    <div class="card-header py-3"><span class="text-white"><i class="fas fa-calendar-alt me-2"></i> REGISTRO DE VENTAS POR MESES</span></div>
                    <div class="card-body p-3">
                        <div class="accordion" id="accordionHistorialMeses"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="azul-bar mt-5"></div>

    <!-- [MODAL CROPPER] Ventana para recortar y ajustar fotos cuadradas -->
    <div class="modal fade" id="modalCropper" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content text-white border rounded-0" style="background-color: var(--surface-dark); border-color: var(--border-blue) !important;">
                <div class="modal-header" style="border-bottom: 1px solid var(--border-blue);">
                    <h5 class="modal-title fw-bold text-white"><i class="fas fa-crop me-2" style="color: var(--blue-electrico);"></i> AJUSTAR FOTOS</h5>
                    <button type="button" class="btn-close btn-close-white" onclick="cancelarProcesoImagenes()"></button>
                </div>
                <div class="modal-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span id="cropperContador" class="fw-bold" style="color: var(--blue-electrico);">Imagen 1 de 1</span>
                        <div class="btn-group">
                            <button type="button" class="btn btn-outline-light btn-sm rounded-0" onclick="navegarCropper(-1)"><i class="fas fa-arrow-left me-1"></i> ANTERIOR</button>
                            <button type="button" class="btn btn-outline-light btn-sm rounded-0" onclick="navegarCropper(1)">SIGUIENTE <i class="fas fa-arrow-right ms-1"></i></button>
                        </div>
                    </div>
                    <div class="img-container-cropper"><img id="imageToCrop" src=""></div>
                </div>
                <div class="modal-footer d-flex justify-content-between" style="border-top: 1px solid var(--border-blue);">
                    <button type="button" class="btn btn-outline-danger btn-sm rounded-0" onclick="eliminarImagenActualCropper()"><i class="fas fa-trash me-1"></i> ELIMINAR FOTO</button>
                    <div>
                        <button type="button" class="btn btn-secondary btn-sm rounded-0" onclick="cancelarProcesoImagenes()">CANCELAR</button>
                        <button type="button" class="btn btn-custom-primary btn-sm rounded-0 px-4" onclick="guardarYContinuarCropper()"><i class="fas fa-check me-1"></i> GUARDAR Y SEGUIR</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- [SCRIPTS Y LÓGICA JAVASCRIPT] Firebase Firestore, autenticación, edición, inventario e historial -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // [CONFIGURACIÓN FIREBASE] Base de datos de administración
        const firebaseConfig = {
            apiKey: "AIzaSyB7I6kAzHBtNQMn0g_7LAPLer5fKpub-E",
            authDomain: "american-look.firebaseapp.com",
            projectId: "american-look",
            storageBucket: "american-look.firebasestorage.app",
            messagingSenderId: "632009260167",
            appId: "1:632009260167:web:248d5d076c46d09ff30c22",
            measurementId: "G-RY5V17QQY3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let listaPrendasMemoria = [];
        let listaHistorialMemoria = [];
        let cropper = null;
        let listaImagenesEnEdicion = []; 
        let indexImagenActual = 0;

        // [AUTENTICACIÓN] Control de acceso al cargar la página
        document.addEventListener("DOMContentLoaded", () => {
            if (localStorage.getItem('admin_auth_130926') === 'true') {
                ocultarPantallaBloqueo();
                iniciarMonitoreoFirestore();
            } else {
                solicitarClaveAcceso();
            }
        });

        window.solicitarClaveAcceso = function() {
            let clave = prompt("🔒 ACCESO RESTRINGIDO\nINGRESA LA CONTRASEÑA:");
            if (clave === "130926") {
                localStorage.setItem('admin_auth_130926', 'true');
                ocultarPantallaBloqueo();
                iniciarMonitoreoFirestore();
            }
        };

        function ocultarPantallaBloqueo() {
            const overlay = document.getElementById('authOverlay');
            if (overlay) overlay.style.display = 'none';
        }

        window.cerrarSesionAdmin = function() {
            localStorage.removeItem('admin_auth_130926');
            window.location.href = "index.html";
        };

        // [SINCRONIZACIÓN FIRESTORE] Escucha en tiempo real prendas e historial de ventas
        function iniciarMonitoreoFirestore() {
            onSnapshot(collection(db, "prendas"), (snapshot) => {
                listaPrendasMemoria = [];
                snapshot.forEach((docSnap) => { listaPrendasMemoria.push({ idDoc: docSnap.id, ...docSnap.data() }); });
                cargarTablaAdmin();
            });

            onSnapshot(collection(db, "historial_ventas"), (snapshot) => {
                listaHistorialMemoria = [];
                snapshot.forEach((docSnap) => { listaHistorialMemoria.push({ idDoc: docSnap.id, ...docSnap.data() }); });
                listaHistorialMemoria.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
                if (!document.getElementById('vistaHistorial').classList.contains('d-none')) {
                    cargarHistorialVentasAdmin();
                }
            });
        }

        // [CONTROL DE VISTAS] Alternar entre Inventario e Historial
        window.cambiarVistaDerecha = function(vista) {
            const btnInventario = document.getElementById('btnTabInventario');
            const btnHistorial = document.getElementById('btnTabHistorial');
            const divInventario = document.getElementById('vistaInventario');
            const divHistorial = document.getElementById('vistaHistorial');

            if (vista === 'inventario') {
                btnInventario.classList.add('active');
                btnHistorial.classList.remove('active');
                divInventario.classList.remove('d-none');
                divHistorial.classList.add('d-none');
                cargarTablaAdmin();
            } else if (vista === 'historial') {
                btnHistorial.classList.add('active');
                btnInventario.classList.remove('active');
                divHistorial.classList.remove('d-none');
                divInventario.classList.add('d-none');
                cargarHistorialVentasAdmin();
            }
        };

        // [PROCESAMIENTO DE IMÁGENES] Carga de archivos y activación del Cropper
        window.procesarArchivosNuevos = function(event) {
            // Recordando a mi querer sin limitaciones: TE AMO NICOLE
            const archivos = event.target.files;
            if (!archivos || archivos.length === 0) return;
            let cargadosPendientes = Array.from(archivos);
            listaImagenesEnEdicion = [];
            indexImagenActual = 0;
            let leidos = 0;
            cargadosPendientes.forEach((archivo, idx) => {
                const lector = new FileReader();
                lector.onload = function(e) {
                    listaImagenesEnEdicion[idx] = e.target.result;
                    leidos++;
                    if (leidos === cargadosPendientes.length) abrirModalCropperConLista();
                };
                lector.readAsDataURL(archivo);
            });
            event.target.value = '';
        };

        window.abrirModalCropperConLista = function() {
            if (listaImagenesEnEdicion.length === 0) return;
            indexImagenActual = 0;
            mostrarImagenActualEnCropper();
            new bootstrap.Modal(document.getElementById('modalCropper')).show();
        };

        window.mostrarImagenActualEnCropper = function() {
            const imageEl = document.getElementById('imageToCrop');
            imageEl.src = listaImagenesEnEdicion[indexImagenActual];
            document.getElementById('cropperContador').innerText = `Imagen ${indexImagenActual + 1} de ${listaImagenesEnEdicion.length}`;
            if (cropper) { cropper.destroy(); cropper = null; }
            setTimeout(() => {
                cropper = new Cropper(imageEl, { aspectRatio: 1, viewMode: 1, autoCropArea: 0.9, responsive: true });
            }, 200);
        };

        window.guardarYContinuarCropper = function() {
            if (cropper) {
                const canvas = cropper.getCroppedCanvas({ width: 800, height: 800 });
                listaImagenesEnEdicion[indexImagenActual] = canvas.toDataURL('image/jpeg', 0.9);
            }
            if (indexImagenActual < listaImagenesEnEdicion.length - 1) {
                indexImagenActual++;
                mostrarImagenActualEnCropper();
            } else {
                finalizarLoteImagenes();
            }
        };

        window.navegarCropper = function(dir) {
            if (cropper) {
                const canvas = cropper.getCroppedCanvas({ width: 800, height: 800 });
                listaImagenesEnEdicion[indexImagenActual] = canvas.toDataURL('image/jpeg', 0.9);
            }
            indexImagenActual += dir;
            if (indexImagenActual < 0) indexImagenActual = 0;
            if (indexImagenActual >= listaImagenesEnEdicion.length) indexImagenActual = listaImagenesEnEdicion.length - 1;
            mostrarImagenActualEnCropper();
        };

        window.eliminarImagenActualCropper = function() {
            if (listaImagenesEnEdicion.length <= 1) return;
            listaImagenesEnEdicion.splice(indexImagenActual, 1);
            if (indexImagenActual >= listaImagenesEnEdicion.length) indexImagenActual = listaImagenesEnEdicion.length - 1;
            mostrarImagenActualEnCropper();
        };

        window.finalizarLoteImagenes = function() {
            if (cropper) { cropper.destroy(); cropper = null; }
            document.getElementById('imagenesBase64Json').value = JSON.stringify(listaImagenesEnEdicion);
            const previewContainer = document.getElementById('previewContainer');
            previewContainer.innerHTML = '';
            previewContainer.classList.remove('d-none');
            listaImagenesEnEdicion.forEach(src => { previewContainer.innerHTML += `<img src="${src}" class="img-preview-box">`; });
            bootstrap.Modal.getInstance(document.getElementById('modalCropper')).hide();
        };

        window.cancelarProcesoImagenes = function() {
            if (cropper) { cropper.destroy(); cropper = null; }
            bootstrap.Modal.getInstance(document.getElementById('modalCropper')).hide();
        };

        // [TABLA DE INVENTARIO] Renderiza stock actual
        window.cargarTablaAdmin = function() {
            const tbody = document.getElementById('tablaAdminStock');
            if (!tbody) return;
            tbody.innerHTML = '';
            const disponibles = listaPrendasMemoria.filter(p => (p.disponibilidad || "Disponible") === "Disponible");

            if (disponibles.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="text-center text-light py-4">NO HAY PRENDAS REGISTRADAS.</td></tr>`;
                return;
            }

            disponibles.forEach(p => {
                let imgs = [];
                try { imgs = p.jsonImagenes ? JSON.parse(p.jsonImagenes) : [p.imagen]; } catch(e) { imgs = [p.imagen]; }
                let miniatura = `<div class="d-flex gap-1">`;
                imgs.forEach(i => miniatura += `<img src="${i}" style="width: 32px; height: 32px; object-fit: cover;" class="rounded-0 border border-secondary">`);
                miniatura += `</div>`;

                tbody.innerHTML += `
                    <tr>
                        <td class="ps-3 fw-bold" style="color: #000000; background-color: #ffffff; padding-left: 8px; padding-right: 8px;">#${p.id || 'N/A'}</td>
                        <td>${miniatura}</td>
                        <td class="fw-bold text-uppercase" style="color: #000000; background-color: #ffffff; padding-left: 8px; padding-right: 8px;">${p.titulo}</td>
                        <td style="color: #000000; background-color: #ffffff; padding-left: 8px; padding-right: 8px; font-weight: 600;">${p.categoria}</td>
                        <td><span class="badge bg-secondary text-white rounded-0">${p.talla}</span></td>
                        <td class="precio-negro text-white">Bs. ${Number(p.precio).toFixed(2)}</td>
                        <td><span class="badge text-white rounded-0" style="background-color: #1d3557;">${p.estado || 'NUEVO'}</span></td>
                        <td class="text-center"><button class="btn btn-outline-info btn-sm rounded-0 px-2 py-1 text-white" onclick="marcarVendido('${p.idDoc}', ${p.precio})" style="border-color: var(--blue-suave);"><i class="fas fa-check"></i></button></td>
                        <td class="text-end pe-3">
                            <button class="btn btn-sm rounded-0 me-1 btn-editar-visible" onclick="cargarEdicion('${p.idDoc}')"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-outline-danger btn-sm rounded-0" onclick="eliminarPrenda('${p.idDoc}')"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        };

        // [GUARDAR / ACTUALIZAR PRENDA] Envía datos a Firestore
        window.guardarPrenda = async function(e) {
            e.preventDefault();
            const idDoc = document.getElementById('prendaIdDoc').value;
            const titulo = document.getElementById('titulo').value;
            const categoria = document.getElementById('categoria').value;
            const talla = document.getElementById('talla').value;
            const estado = document.getElementById('estado').value;
            const precio = parseFloat(document.getElementById('precio').value);
            const descripcion = document.getElementById('descripcion').value;
            let jsonImagenes = document.getElementById('imagenesBase64Json').value;

            try {
                if (idDoc) {
                    const prendaRef = doc(db, "prendas", idDoc);
                    let datosActualizados = { titulo, categoria, talla, estado, precio, descripcion };
                    if (jsonImagenes.trim() !== "") {
                        datosActualizados.jsonImagenes = jsonImagenes;
                        datosActualizados.imagen = JSON.parse(jsonImagenes)[0];
                    }
                    await updateDoc(prendaRef, datosActualizados);
                } else {
                    if (!jsonImagenes) return;
                    const nuevoId = listaPrendasMemoria.length > 0 ? Math.max(...listaPrendasMemoria.map(p => p.id || 0)) + 1 : 1;
                    await addDoc(collection(db, "prendas"), {
                        id: nuevoId, titulo, categoria, talla, estado, disponibilidad: "Disponible", precio, descripcion, jsonImagenes, imagen: JSON.parse(jsonImagenes)[0]
                    });
                }
                limpiarFormulario();
            } catch (error) { console.error("Error: ", error); }
        };

        // [MARCAR COMO VENDIDO] Mueve la prenda al historial de ventas
        window.marcarVendido = async function(idDoc, precioSug) {
            let precioVentaStr = prompt("INGRESA EL PRECIO FINAL DE VENTA (Bs.):", precioSug);
            if (precioVentaStr === null) return;
            let precioVenta = parseFloat(precioVentaStr);
            if (isNaN(precioVenta) || precioVenta < 0) return;

            try {
                const prendaRef = doc(db, "prendas", idDoc);
                await updateDoc(prendaRef, { disponibilidad: "Agotado" });
                let prendaVendida = listaPrendasMemoria.find(p => p.idDoc === idDoc);
                await addDoc(collection(db, "historial_ventas"), {
                    idPrendaDoc: idDoc,
                    idPrendaNum: prendaVendida ? (prendaVendida.id || 0) : 0,
                    titulo: prendaVendida ? prendaVendida.titulo : "Prenda",
                    talla: prendaVendida ? prendaVendida.talla : "-",
                    precioOriginal: prendaVendida ? Number(prendaVendida.precio) : 0,
                    precioVenta: precioVenta,
                    fecha: new Date().toISOString()
                });
            } catch (error) { console.error("Error: ", error); }
        };

        // [DEVOLVER A STOCK] Revierte una venta y la regresa al inventario
        window.devolverAlInventario = async function(idVentaDoc, idPrendaDoc) {
            try {
                if (idPrendaDoc) {
                    const prendaRef = doc(db, "prendas", idPrendaDoc);
                    await updateDoc(prendaRef, { disponibilidad: "Disponible" });
                }
                const ventaRef = doc(db, "historial_ventas", idVentaDoc);
                await deleteDoc(ventaRef);
            } catch (error) { console.error("Error: ", error); }
        };

        window.eliminarPrenda = async function(idDoc) {
            try { await deleteDoc(doc(db, "prendas", idDoc)); } catch (error) { console.error("Error: ", error); }
        };

        // [CARGAR EDICIÓN] Rellena el formulario con los datos de la prenda seleccionada
        window.cargarEdicion = function(idDoc) {
            const prenda = listaPrendasMemoria.find(p => String(p.idDoc) === String(idDoc));
            if (prenda) {
                document.getElementById('prendaIdDoc').value = prenda.idDoc;
                document.getElementById('titulo').value = prenda.titulo || '';
                document.getElementById('categoria').value = prenda.categoria || 'Chamarras';
                document.getElementById('talla').value = prenda.talla || '';
                document.getElementById('precio').value = prenda.precio || '';
                document.getElementById('estado').value = prenda.estado || "Nuevo";
                document.getElementById('descripcion').value = prenda.descripcion || '';
                
                let imgsJson = prenda.jsonImagenes || JSON.stringify([prenda.imagen]);
                document.getElementById('imagenesBase64Json').value = imgsJson;
                
                try {
                    listaImagenesEnEdicion = JSON.parse(imgsJson);
                } catch(e) {
                    listaImagenesEnEdicion = [prenda.imagen];
                }
                
                const previewContainer = document.getElementById('previewContainer');
                previewContainer.innerHTML = '';
                previewContainer.classList.remove('d-none');
                listaImagenesEnEdicion.forEach(src => { 
                    previewContainer.innerHTML += `<img src="${src}" class="img-preview-box">`; 
                });

                document.getElementById('tituloFormulario').innerText = `EDITAR PRENDA`;
                document.getElementById('btnAccion').innerHTML = '<i class="fas fa-save me-1"></i> GUARDAR CAMBIOS';
                document.getElementById('btnCancelar').classList.remove('d-none');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        window.limpiarFormulario = function() {
            document.getElementById('formPrenda').reset();
            document.getElementById('prendaIdDoc').value = '';
            document.getElementById('imagenesBase64Json').value = '';
            listaImagenesEnEdicion = [];
            const previewContainer = document.getElementById('previewContainer');
            if (previewContainer) {
                previewContainer.innerHTML = '';
                previewContainer.classList.add('d-none');
            }
            document.getElementById('tituloFormulario').innerText = "REGISTRAR PRENDA";
            document.getElementById('btnAccion').innerHTML = '<i class="fas fa-check me-1"></i> PUBLICAR PRENDA';
            document.getElementById('btnCancelar').classList.add('d-none');
        };

        // [HISTORIAL DE VENTAS] Agrupación por meses, días y cálculo de totales diarios
        window.cargarHistorialVentasAdmin = function() {
            const contenedor = document.getElementById('accordionHistorialMeses');
            if (!contenedor) return;
            contenedor.innerHTML = '';

            if (listaHistorialMemoria.length === 0) {
                contenedor.innerHTML = `<p class="text-light text-center py-4">NO HAY VENTAS REGISTRADAS.</p>`;
                return;
            }

            let mesesAgrupados = {};
            let fechaActual = new Date();

            listaHistorialMemoria.forEach(v => {
                let fechaObj = new Date(v.fecha);
                let nombreMes = fechaObj.toLocaleString('es-ES', { month: 'long', year: 'numeric' });
                nombreMes = nombreMes.charAt(0).toUpperCase() + nombreMes.slice(1);
                let ultimoDiaDelMes = new Date(fechaObj.getFullYear(), fechaObj.getMonth() + 1, 0, 23, 59, 59);
                let mesEsPasado = fechaActual > ultimoDiaDelMes;

                if (!mesesAgrupados[nombreMes]) {
                    mesesAgrupados[nombreMes] = { ventas: [], totalMes: 0, esPasado: mesEsPasado, anio: fechaObj.getFullYear(), mesIndex: fechaObj.getMonth() };
                }
                mesesAgrupados[nombreMes].ventas.push(v);
                mesesAgrupados[nombreMes].totalMes += Number(v.precioVenta || 0);
            });

            let htmlAcordeon = '';
            let index = 0;

            for (let mes in mesesAgrupados) {
                let datosMes = mesesAgrupados[mes];
                let collapseId = `collapseMes${index}`;
                let headingId = `headingMes${index}`;
                let searchInputId = `searchMes_${index}`;
                let dateInputId = `dateSearchMes_${index}`;
                let listContainerId = `listaVentasMes_${index}`;
                let showClass = (mes.toLowerCase().includes('octubre') && mes.toLowerCase().includes('2026')) || index === 0 ? 'show' : '';
                let expandedAttr = (mes.toLowerCase().includes('octubre') && mes.toLowerCase().includes('2026')) || index === 0 ? 'true' : 'false';

                let primerDiaMesStr = `${datosMes.anio}-${String(datosMes.mesIndex + 1).padStart(2, '0')}-01`;
                let ultimoDiaFechaObj = new Date(datosMes.anio, datosMes.mesIndex + 1, 0);
                let ultimoDiaMesStr = `${datosMes.anio}-${String(datosMes.mesIndex + 1).padStart(2, '0')}-${String(ultimoDiaFechaObj.getDate()).padStart(2, '0')}`;

                let diasDelMesAgrupados = {};
                datosMes.ventas.forEach(v => {
                    let f = new Date(v.fecha);
                    let nombreDia = f.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
                    nombreDia = nombreDia.charAt(0).toUpperCase() + nombreDia.slice(1);
                    if (!diasDelMesAgrupados[nombreDia]) diasDelMesAgrupados[nombreDia] = [];
                    diasDelMesAgrupados[nombreDia].push(v);
                });

                htmlAcordeon += `
                    <div class="accordion-item mb-2 rounded-0 overflow-hidden" style="background-color: var(--surface-dark); border: 1px solid var(--border-blue);">
                        <h2 class="accordion-header" id="${headingId}">
                            <div class="accordion-button ${!((mes.toLowerCase().includes('octubre') && mes.toLowerCase().includes('2026')) || index === 0) ? 'collapsed' : ''} text-white fw-bold d-flex flex-wrap align-items-center justify-content-between gap-2 py-3" style="background-color: #0c101d;" data-bs-toggle="collapse" data-bs-target="#${collapseId}" aria-expanded="${expandedAttr}" aria-controls="${collapseId}">
                                <div class="d-flex align-items-center me-2"><i class="fas fa-calendar-alt me-2" style="color: var(--blue-electrico);"></i> <span>${mes}</span></div>
                                <div class="d-flex flex-wrap align-items-center gap-2 mx-auto my-1 flex-grow-1 px-2 justify-content-end" style="max-width: 480px;" onclick="event.stopPropagation();">
                                    <input type="text" id="${searchInputId}" class="form-control form-control-sm rounded-0 text-white" placeholder="BUSCAR..." onkeyup="filtrarVentasMes('${index}', '${mes}')" style="width: 140px;">
                                    <input type="date" id="${dateInputId}" class="form-control form-control-sm rounded-0 text-white" min="${primerDiaMesStr}" max="${ultimoDiaMesStr}" onchange="filtrarVentasMes('${index}', '${mes}')" style="width: 140px; background-color: var(--bg-dark); color-scheme: dark;" title="Filtrar por fecha">
                                </div>
                                <div class="ms-auto pe-2"><span class="badge text-white fs-6 px-3 py-2 rounded-0 shadow-sm" style="background-color: var(--blue-suave); font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; letter-spacing: 0.5px;">TOTAL: Bs. ${datosMes.totalMes.toFixed(2)}</span></div>
                            </div>
                        </h2>
                        <div id="${collapseId}" class="accordion-collapse collapse ${showClass}" aria-labelledby="${headingId}" data-bs-parent="#accordionHistorialMeses">
                            <div class="accordion-body p-3" style="background-color: var(--surface-dark);">
                                <div id="${listContainerId}">${generarHtmlDiasMes(diasDelMesAgrupados, datosMes.esPasado)}</div>
                            </div>
                        </div>
                    </div>
                `;
                index++;
            }
            contenedor.innerHTML = htmlAcordeon;
            window.mesesAgrupadosMemoria = mesesAgrupados;
        };

        function generarHtmlDiasMes(diasAgrupados, esPasado) {
            let html = '';
            let diaIndex = 0;
            for (let dia in diasAgrupados) {
                let subCollapseId = `subCollapseDia_${diaIndex}_${Math.random().toString(36).substring(2,7)}`;
                let subHeadingId = `subHeadingDia_${diaIndex}`;
                
                let totalDia = 0;
                diasAgrupados[dia].forEach(v => { totalDia += Number(v.precioVenta || 0); });
                
                html += `
                    <div class="mb-3 rounded-0 overflow-hidden" style="background-color: #0c101d; border: 1px solid var(--border-blue);">
                        <div class="accordion accordion-flush" id="accordionDia_${diaIndex}">
                            <div class="accordion-item bg-transparent border-0">
                                <h2 class="accordion-header" id="${subHeadingId}">
                                    <button class="accordion-button collapsed py-2 px-3 shadow-none d-flex flex-wrap justify-content-between align-items-center gap-2" type="button" data-bs-toggle="collapse" data-bs-target="#${subCollapseId}" aria-expanded="false" aria-controls="${subCollapseId}" style="background-color: #121829;">
                                        <span class="fw-bold text-uppercase" style="color: var(--blue-electrico) !important;">
                                            <i class="far fa-folder-open me-2"></i> ${dia} <span class="text-light small fw-normal">(${diasAgrupados[dia].length} ${diasAgrupados[dia].length === 1 ? 'venta' : 'ventas'})</span>
                                        </span>
                                        <span class="badge text-white px-3 py-2 rounded-0 shadow-sm ms-auto" style="background-color: var(--blue-suave); font-weight: 800; font-size: 0.9rem;">
                                            TOTAL DÍA: Bs. ${totalDia.toFixed(2)}
                                        </span>
                                    </button>
                                </h2>
                                <div id="${subCollapseId}" class="accordion-collapse collapse" aria-labelledby="${subHeadingId}" data-bs-parent="#accordionDia_${diaIndex}">
                                    <div class="accordion-body p-3">
                                        <ul class="list-group list-group-flush bg-transparent">
                `;
                
                diasAgrupados[dia].forEach(v => {
                    let horaCompleta = new Date(v.fecha).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
                    let botonDevolverHtml = !esPasado ? `
                        <button class="btn btn-outline-info btn-sm text-white fw-bold rounded-0" onclick="devolverAlInventario('${v.idDoc}', '${v.idPrendaDoc}')" title="Devolver al inventario" style="border-color: var(--blue-suave);">
                            <i class="fas fa-undo me-1"></i> DEVOLVER A STOCK
                        </button>
                    ` : `<span class="badge bg-secondary text-white rounded-0"><i class="fas fa-lock me-1"></i> CERRADO</span>`;

                    html += `
                        <li class="list-group-item bg-transparent text-white d-flex justify-content-between align-items-center py-2 px-0" style="border-bottom: 1px solid var(--border-blue);">
                            <div>
                                <span class="fw-bold text-uppercase text-white">${v.titulo}</span> <span class="badge bg-secondary text-white rounded-0 ms-1">TALLA: ${v.talla}</span>
                                <div class="small text-light"><i class="far fa-clock me-1"></i> Hora: ${horaCompleta} | Ref: Bs. ${v.precioOriginal}</div>
                            </div>
                            <div class="d-flex align-items-center gap-3">
                                <span class="badge text-white fs-6 rounded-0" style="background-color: #1d3557;">VENTA: Bs. ${v.precioVenta}</span>
                                ${botonDevolverHtml}
                            </div>
                        </li>
                    `;
                });
                
                html += `</ul></div></div></div></div></div>`;
                diaIndex++;
            }
            return html;
        }

        window.filtrarVentasMes = function(index, mesNombre) {
            const inputVal = document.getElementById(`searchMes_${index}`).value.toLowerCase();
            const dateVal = document.getElementById(`dateSearchMes_${index}`).value;
            const listContainer = document.getElementById(`listaVentasMes_${index}`);
            const datosMes = window.mesesAgrupadosMemoria[mesNombre];
            if (!datosMes) return;

            let filtradas = datosMes.ventas.filter(v => {
                let matchTexto = v.titulo.toLowerCase().includes(inputVal);
                let matchFecha = true;
                if (dateVal) {
                    let fechaVentaStr = v.fecha.split('T')[0];
                    matchFecha = (fechaVentaStr === dateVal);
                }
                return matchTexto && matchFecha;
            });

            if (filtradas.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-light py-3 small bg-black border border-secondary">NO SE ENCONTRARON VENTAS CON ESOS CRITERIOS.</div>`;
            } else {
                let diasFiltrados = {};
                filtradas.forEach(v => {
                    let f = new Date(v.fecha);
                    let nombreDia = f.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
                    nombreDia = nombreDia.charAt(0).toUpperCase() + nombreDia.slice(1);
                    if (!diasFiltrados[nombreDia]) diasFiltrados[nombreDia] = [];
                    diasFiltrados[nombreDia].push(v);
                });
                listContainer.innerHTML = generarHtmlDiasMes(diasFiltrados, datosMes.esPasado);
            }
        };
    </script>
</body>
</html>
